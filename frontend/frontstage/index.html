<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#153f38" />
    <meta name="dpp-api-base" content="/api" />
    <meta name="dpp-asset-base" content="/" />
    <title>電池數位產品護照</title>
    <script>
      if (window.location.protocol !== 'file:') {
        const base = document.createElement('base')
        base.href = '/'
        document.head.append(base)
      }
    </script>
    <link rel="stylesheet" href="styles.css" />
    <script src="mock-data.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">跳至主要內容</a>

    <main id="main-content" class="passport-shell" tabindex="-1">
      <div class="ambient-grid" aria-hidden="true"></div>
      <p id="page-status" class="sr-only" role="status" aria-live="polite"></p>

      <section id="loading-state" class="state-card" aria-live="polite" aria-busy="true">
        <div class="loader" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <p>正在讀取電池護照資料</p>
      </section>

      <section id="error-state" class="state-card state-card--error" role="alert" hidden>
        <svg class="state-icon" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M24 4 3 42h42L24 4Z" />
          <path d="M24 17v12M24 35v1" />
        </svg>
        <h1>無法顯示護照資料</h1>
        <p id="error-message">請確認網址或稍後再試。</p>
        <button id="retry-button" class="button button--primary" type="button">重新讀取</button>
      </section>

      <article id="passport-content" hidden>
        <div class="passport-heading">
          <div>
            <h1 id="passport-title">電池數位產品護照</h1>
            <p id="data-source-label" class="data-source-label">資料由公開護照 API 即時提供</p>
          </div>
          <div class="passport-actions" aria-label="頁面工具">
            <button id="carbon-button" class="carbon-summary" type="button" aria-haspopup="dialog">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19.5 4.5C12.5 4.8 7.2 7.5 6.4 13.2c-.4 3 1.7 5.6 4.6 5.8 5.7.4 8.5-5.7 8.5-14.5Z" />
                <path d="M4.5 20c2-4.6 5.4-7.8 10.4-9.8" />
              </svg>
              <span>碳足跡</span>
            </button>
            <button id="print-button" class="tool-button" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 8V3h10v5M7 17H4V9h16v8h-3M7 14h10v7H7z" />
              </svg>
              <span>列印</span>
            </button>
            <a id="email-share" class="tool-button" href="#" aria-label="使用郵件分享">
              <svg class="tool-button__icon--fill" viewBox="0 0 512 512" aria-hidden="true">
                <path d="M48 64C21.5 64 0 85.5 0 112c0 15.1 7.1 29.3 19.2 38.4l217.6 163.2c11.4 8.5 27 8.5 38.4 0l217.6-163.2c12.1-9.1 19.2-23.3 19.2-38.4 0-26.5-21.5-48-48-48H48zM0 176v208c0 35.3 28.7 64 64 64h384c35.3 0 64-28.7 64-64V176L294.4 339.2c-22.8 17.1-54 17.1-76.8 0L0 176z" />
              </svg>
              <span>郵件</span>
            </a>
            <a
              id="facebook-share"
              class="tool-button"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="FB 分享（另開新分頁）"
            >
              <svg class="tool-button__icon--fill" viewBox="0 0 448 512" aria-hidden="true">
                <path d="M400 32H48A48 48 0 0 0 0 80v352a48 48 0 0 0 48 48h137.25V327.69h-63V256h63v-54.64c0-62.15 37-96.48 93.67-96.48 27.14 0 55.52 4.84 55.52 4.84v61h-31.27c-30.81 0-40.42 19.12-40.42 38.73V256h68.78l-11 71.69h-57.78V480H400a48 48 0 0 0 48-48V80a48 48 0 0 0-48-48z" />
              </svg>
              <span>FB</span>
            </a>
            <a
              id="line-share"
              class="tool-button"
              href="#"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Line 分享（另開新分頁）"
            >
              <svg class="tool-button__icon--fill" viewBox="0 0 512 512" aria-hidden="true">
                <path d="M311 196.8v81.3c0 2.1-1.6 3.7-3.7 3.7h-13c-1.3 0-2.4-.7-3-1.5L254 230v48.2c0 2.1-1.6 3.7-3.7 3.7h-13c-2.1 0-3.7-1.6-3.7-3.7v-81.3c0-2.1 1.6-3.7 3.7-3.7h12.9c1.1 0 2.4.6 3 1.6l37.3 50.3v-48.2c0-2.1 1.6-3.7 3.7-3.7h13c2.1-.1 3.8 1.6 3.8 3.5zm-93.7-3.7h-13c-2.1 0-3.7 1.6-3.7 3.7v81.3c0 2.1 1.6 3.7 3.7 3.7h13c2.1 0 3.7-1.6 3.7-3.7v-81.3c0-1.9-1.6-3.7-3.7-3.7zm-31.4 68.1h-35.6v-64.4c0-2.1-1.6-3.7-3.7-3.7h-13c-2.1 0-3.7 1.6-3.7 3.7v81.3c0 1 .3 1.8 1 2.5.7.6 1.5 1 2.5 1h52.2c2.1 0 3.7-1.6 3.7-3.7v-13c0-1.9-1.6-3.7-3.5-3.7zm193.7-68.1h-52.3c-1.9 0-3.7 1.6-3.7 3.7v81.3c0 1.9 1.6 3.7 3.7 3.7h52.2c2.1 0 3.7-1.6 3.7-3.7V265c0-2.1-1.6-3.7-3.7-3.7H344v-13.6h35.5c2.1 0 3.7-1.6 3.7-3.7v-13.1c0-2.1-1.6-3.7-3.7-3.7H344v-13.7h35.5c2.1 0 3.7-1.6 3.7-3.7v-13c-.1-1.9-1.7-3.7-3.7-3.7zM512 93.4v326c-.1 51.2-42.1 92.7-93.4 92.6h-326C41.4 511.9-.1 469.8 0 418.6v-326C.1 41.4 42.2-.1 93.4 0h326c51.2.1 92.7 42.1 92.6 93.4zm-70.4 140.1c0-83.4-83.7-151.3-186.4-151.3S68.8 150.1 68.8 233.5c0 74.7 66.3 137.4 155.9 149.3 21.8 4.7 19.3 12.7 14.4 42.1-.8 4.7-3.8 18.4 16.1 10.1s107.3-63.2 146.5-108.2c27-29.7 39.9-59.8 39.9-93.1z" />
              </svg>
              <span>Line</span>
            </a>
          </div>
        </div>

        <section class="overview-grid" aria-label="護照概覽">
          <section class="data-card" aria-labelledby="basic-title">
            <h2 id="basic-title" class="section-title">基本資訊</h2>
            <dl id="basic-info" class="data-list"></dl>
          </section>

          <section class="data-card data-card--visual" aria-labelledby="visual-title">
            <h2 id="visual-title" class="section-title">產品示意圖</h2>
            <div id="product-visual" class="product-visual">
              <div class="battery-illustration" aria-hidden="true">
                <div class="battery-illustration__terminal"></div>
                <div class="battery-illustration__body">
                  <span>+</span>
                  <div class="battery-illustration__charge"></div>
                </div>
              </div>
            </div>
          </section>

          <section class="data-card data-card--wide" aria-labelledby="identity-title">
            <h2 id="identity-title" class="section-title">識別資訊</h2>
            <dl id="identity-info" class="data-list data-list--columns"></dl>
          </section>
        </section>

        <section class="verification-section" aria-labelledby="verification-title">
          <h2 id="verification-title" class="section-title">標準查證</h2>
          <div id="verification-content"></div>
        </section>

        <section id="detail-tabs" class="passport-details" aria-labelledby="details-title">
          <h2 id="details-title" class="sr-only">護照技術資料</h2>
          <div class="tab-rail">
            <div class="tab-list" role="tablist" aria-label="護照技術資料分類">
              <button id="tab-material" role="tab" aria-selected="true" aria-controls="panel-material" tabindex="0" type="button">材料資訊</button>
              <button id="tab-specification" role="tab" aria-selected="false" aria-controls="panel-specification" tabindex="-1" type="button">特定資訊</button>
              <button id="tab-trademark" role="tab" aria-selected="false" aria-controls="panel-trademark" tabindex="-1" type="button">商標</button>
              <button id="tab-links" role="tab" aria-selected="false" aria-controls="panel-links" tabindex="-1" type="button">說明與連結</button>
              <button id="tab-repair" role="tab" aria-selected="false" aria-controls="panel-repair" tabindex="-1" type="button">維修紀錄</button>
              <button id="tab-recycle" role="tab" aria-selected="false" aria-controls="panel-recycle" tabindex="-1" type="button">回收紀錄</button>
            </div>
          </div>

          <section id="panel-material" class="tab-panel" role="tabpanel" aria-labelledby="tab-material" tabindex="0"></section>
          <section id="panel-specification" class="tab-panel" role="tabpanel" aria-labelledby="tab-specification" tabindex="0" hidden></section>
          <section id="panel-trademark" class="tab-panel" role="tabpanel" aria-labelledby="tab-trademark" tabindex="0" hidden></section>
          <section id="panel-links" class="tab-panel" role="tabpanel" aria-labelledby="tab-links" tabindex="0" hidden></section>
          <section id="panel-repair" class="tab-panel" role="tabpanel" aria-labelledby="tab-repair" tabindex="0" hidden></section>
          <section id="panel-recycle" class="tab-panel" role="tabpanel" aria-labelledby="tab-recycle" tabindex="0" hidden></section>
        </section>
      </article>
    </main>

    <dialog id="carbon-dialog" class="carbon-dialog" aria-labelledby="carbon-dialog-title">
      <div class="carbon-dialog__heading">
        <h2 id="carbon-dialog-title">碳足跡資訊</h2>
        <button id="carbon-dialog-close" class="dialog-close" type="button" aria-label="關閉碳足跡資訊">
          <span aria-hidden="true">×</span>
        </button>
      </div>
      <div class="carbon-dialog__content">
        <img src="images/co2.svg" alt="" />
        <dl class="carbon-data">
          <div>
            <dt>碳足跡日期</dt>
            <dd id="carbon-date">—</dd>
          </div>
          <div>
            <dt>碳足跡值</dt>
            <dd id="carbon-value">—</dd>
          </div>
          <div>
            <dt>排放單位</dt>
            <dd id="carbon-unit">—</dd>
          </div>
          <div>
            <dt>功能單位</dt>
            <dd id="carbon-function-unit">—</dd>
          </div>
        </dl>
      </div>
    </dialog>
  </body>
</html>
