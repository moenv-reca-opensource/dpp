services:
  backend:
    build:
      context: ./docker/php
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/html

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/html:ro
    depends_on:
      - backend
